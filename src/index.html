<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>MiMo Code - Max</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Title Bar -->
  <div id="titlebar">
    <div id="titlebar-left">
      <img id="titlebar-icon" src="../assets/icon.png" alt="">
      <span id="titlebar-title">MiMo Code - Max</span>
    </div>
    <div id="titlebar-controls">
      <button id="btn-minimize" title="Minimize">&#x2500;</button>
      <button id="btn-maximize" title="Maximize">&#x25A1;</button>
      <button id="btn-close" title="Close">&#x2715;</button>
    </div>
  </div>

  <!-- Main Layout -->
  <div id="app">
    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-header">
        <button id="btn-new-chat" title="New Chat">+ New Chat</button>
      </div>
      <div id="session-list"></div>
      <div id="sidebar-footer">
        <button id="btn-settings" title="Settings">&#x2699; 设置</button>
      </div>
    </div>

    <!-- Chat Area -->
    <div id="chat-area">
      <div id="chat-header">
        <span id="chat-title">选择一个会话</span>
        <select id="model-selector"></select>
        <span id="chat-status"></span>
        <span id="connection-status" class="status-connected">已连接</span>
      </div>
      <div id="messages"></div>
      <div id="input-area">
        <div id="image-preview-area"></div>
        <div id="queue-info" class="hidden">
          <span id="queue-count">0</span> 条消息排队中
          <span id="queue-preview" class="queue-preview"></span>
          <button id="btn-insert-queue" title="打断当前任务，立即发送排队消息">立即插入</button>
          <button id="btn-cancel-queue" title="取消排队">取消</button>
        </div>
        <div id="input-wrapper">
          <textarea id="message-input" placeholder="输入消息... (Ctrl+V 粘贴图片)" rows="1"></textarea>
          <button id="btn-send" title="Send">&#x27A4;</button>
          <button id="btn-stop" title="Stop" class="hidden">&#x25A0;</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Panel (hidden by default) -->
  <div id="settings-panel" class="hidden">
    <div id="settings-content">
      <h2>设置</h2>
      <div class="settings-layout">
        <!-- Left sidebar: Navigation -->
        <div class="settings-nav">
          <button class="settings-nav-item active" data-tab="connection">连接</button>
          <button class="settings-nav-item" data-tab="appearance">外观</button>
          <button class="settings-nav-item" data-tab="display">显示</button>
          <button class="settings-nav-item" data-tab="logs">日志</button>
        </div>

        <!-- Right content: Settings panels -->
        <div class="settings-main">
          <!-- Connection tab -->
          <div class="settings-tab active" id="tab-connection">
            <h3>连接</h3>
            <div class="setting-group">
              <label>服务器地址</label>
              <input type="text" id="setting-server-url" placeholder="http://127.0.0.1:4096">
            </div>
            <div class="setting-group">
              <label>服务器端口</label>
              <input type="number" id="setting-server-port" value="4096" min="1024" max="65535">
            </div>
            <div class="setting-group">
              <label>
                <input type="checkbox" id="setting-auto-start-server" checked>
                自动启动服务器
              </label>
            </div>
          </div>

          <!-- Appearance tab -->
          <div class="settings-tab" id="tab-appearance">
            <h3>外观</h3>
            <div class="setting-group">
              <label>应用标题</label>
              <input type="text" id="setting-app-title" placeholder="MiMo Code - Max">
            </div>
            <div class="setting-row">
              <div class="setting-group">
                <label>主题</label>
                <select id="setting-theme">
                  <option value="light">浅色</option>
                  <option value="dark">深色</option>
                </select>
              </div>
              <div class="setting-group">
                <label>字体大小</label>
                <select id="setting-font-size">
                  <option value="12">12px</option>
                  <option value="13">13px</option>
                  <option value="14" selected>14px</option>
                  <option value="15">15px</option>
                  <option value="16">16px</option>
                </select>
              </div>
            </div>
            <div class="setting-row">
              <div class="setting-group">
                <label>背景图片</label>
                <input type="text" id="setting-bg-image" placeholder="URL 或路径">
              </div>
              <div class="setting-group">
                <label>Logo 图片</label>
                <input type="text" id="setting-logo-image" placeholder="URL 或路径">
              </div>
            </div>
            <div class="setting-group">
              <label>自定义 CSS</label>
              <textarea id="setting-custom-css" rows="4" placeholder="/* 自定义样式 */"></textarea>
            </div>
          </div>

          <!-- Display tab -->
          <div class="settings-tab" id="tab-display">
            <h3>显示</h3>
            <div class="setting-group">
              <label>消息最大宽度</label>
              <select id="setting-msg-width">
                <option value="60">60%</option>
                <option value="70">70%</option>
                <option value="80" selected>80%</option>
                <option value="90">90%</option>
                <option value="100">100%</option>
              </select>
            </div>
            <div class="setting-group">
              <label>
                <input type="checkbox" id="setting-show-timestamps" checked>
                显示时间戳
              </label>
            </div>
          </div>

          <!-- Logs tab -->
          <div class="settings-tab" id="tab-logs">
            <h3>日志</h3>
            <div class="setting-group">
              <button id="btn-view-logs" class="btn-secondary">查看日志</button>
            </div>
            <div id="log-viewer" class="hidden">
              <textarea id="log-content" rows="20" readonly></textarea>
            </div>
          </div>
        </div>
      </div>

      <div class="setting-footer">
        <span class="version-info">版本 <span id="app-version">v1.0.0</span></span>
        <div class="setting-actions">
          <button id="btn-save-settings" class="btn-primary">保存</button>
          <button id="btn-close-settings" class="btn-secondary">取消</button>
        </div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
